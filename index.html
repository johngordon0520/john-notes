<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>John's Notes</title>

  <!-- Home-screen app behaviour -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FDFBF6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="John's Notes" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #FDFBF6; }
    /* Splash while React boots — replaced on first paint */
    #boot {
      font-family: Georgia, serif; color: #14503F; text-align: center;
      padding-top: 38vh; font-size: 20px; letter-spacing: -0.01em;
    }
    #boot small { display: block; font-family: system-ui, sans-serif;
      font-size: 12px; color: #7C7568; margin-top: 8px; letter-spacing: 0; }
  </style>
</head>
<body>
  <div id="root"><div id="boot">John's Notes<small>Loading…</small></div></div>

  <!-- Libraries load from a CDN on the very first launch only. The service
       worker caches them immediately, so every launch after that is offline. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" src="app.jsx" data-presets="react"></script>

  <script>
    // Register the service worker that makes the app work with no connection.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("Offline mode unavailable:", e);
        });
      });
    }
  </script>
</body>
</html>
